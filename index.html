<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="icon" href="icons/favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Archipelago</title>
</head>
<script type="text/javascript" src="scripts/load_json.js"></script>

<div class="fucking-everything">
    <div class="left-side">
        <div id="ap-tracker">
            <script type="text/javascript" src="scripts/tracker.js"></script>
        </div>
    </div>

    <div class="right-side">
        <div class="a-row">
            <label>Webhost: </label><input id="ap-host" value="ws://localhost:38281"></input>
        </div>
        <div class="a-row">
            <label>Slot Name: </label><input id="ap-slot" value="Player1">
        </div>
        <div class="a-row">
            <label>Game: Touhou Music</label>
        </div>
        <div>
            <button onclick="ap_connect()">Connect</button>
            <!-- <button onclick="ap_disconnect()">Disconnect</button> -->
        </div>
        <p></p>
        <script type="text/javascript" src="scripts/ap_connect.js"></script>
        <script>
            const tags = ["AP", "WebHost"];
        </script>
            

        <div id="queue-text">Queue:</div>

        <div id="info-text-game">game</div>
        <div id="info-text">song</div>
        <div id="info-text-bottom">song</div>
        <!-- <div id="info-text-composer">composer</div> -->
        <div id="requirement-images"></div>

        <div class="audio-player">
            <button id="play-pause" style="margin-top: 0px;">▶</button>
            <div class="progress-bar-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="volume-container">
                <span class="volume-icon">🔊</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
            </div>
        </div>
        <audio autoplay id="audio" src=""></audio>
        <div>
            <!-- <button onclick="choose_track(-1)">Prev Song</button> -->
            <button onclick="audio.currentTime = 0; audio.play;">Replay Song</button>
            <label for="loop-song-toggle">Loop Current Song:</label><input type="checkbox" id="loop-song-toggle"></input>
            
        </div>
        <div>
            <button onclick="nextInQueue();">Next in Queue</button>
            <button onclick="shuffleQueue(queue, document.getElementById('queue-text'));">Shuffle Queue</button>
            <button onclick="queue = []; document.getElementById('queue-text').innerHTML = 'Queue:';">Clear Queue</button>
        </div>
        <div>
            <button onclick="sendLocation();">Debug: Send Location</button>
        </div>
        <div>
            <button class="victory-btn" onclick="send_victory()">It says goalable on the ceiling</button>
            <div id="requiredBounties">Bounties required to goal: </div>
        </div>
        <!-- <button class="top-button-enabled" id="shuffle" onclick="modeSelectPress('shuffle'); shuffle_mode = !shuffle_mode;">Shuffle</button> -->
        <script type="text/javascript" src="scripts/audio.js"></script>

        <br>
        <div class="text-client-container">
            <div class="text-client-header">Text Client</div>
            
            <div class="text-client-log" id="textClientLog">
            <div class="log-line">Waiting for AP Connection...</div>
            </div>

            <div class="text-client-input-container">
            <span class="prompt-symbol">&gt;</span>
            <input type="text" class="text-client-input" id="textClientInput" placeholder="Type a command..." autofocus />
            </div>
            <script type="text/javascript" src="scripts/text_client.js"></script>
        </div>
    </div>
</div>

    <!-- Settings Cog Icon -->
    <div class="settings-icon" onclick="openModal()">⚙️</div>

    <!-- Popup Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div id="selection-container" class="selection-container">
                <div class="album-container" id="album-container">
                    <table>
                        <tbody id="album-list">
                            
                        </tbody>
                    </table>
                </div>
                <div class="album-container" id="song-container">
                    <table>
                        <tbody id="song-list">
        
                        </tbody>
                    </table>
                </div>
            </div>
            <button class="close-btn" onclick="closeModal()">Save & Close</button>
            <button class="victory-btn" onclick="addAllInLogic()">Add all in logic to queue</button>
        </div>
    </div>
    <script type="text/javascript" src="scripts/modal.js"></script>

    <script type="text/javascript" src="scripts/initialize_after_connect.js"></script>
